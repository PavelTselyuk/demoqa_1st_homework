plugins {
    id 'java-library'
    id 'io.qameta.allure' version '3.0.2'
}

repositories {
    mavenCentral()
}


allure {
    report {
        version.set("2.35.1")
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set("2.35.1") //версия интеграции фреймворка и Allure
            }
        }
    }
}

dependencies {
    testImplementation("com.codeborne:selenide:7.14.0")
    testImplementation("io.qameta.allure:allure-selenide:2.32.0")
    testImplementation( "org.slf4j:slf4j-simple:2.0.17")
    testImplementation("org.junit.jupiter:junit-jupiter:5.14.2")

    testRuntimeOnly ("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly ("org.junit.jupiter:junit-jupiter-engine:5.14.2")
}

tasks.withType(Test) {
    useJUnitPlatform()

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}
